<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | La Brioche</title>
    <link rel="stylesheet" href="../theme.css" />
    <style>
      body {
        background: #fffaf1;
        color: #24332d;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
      }
      main {
        background: white;
        border: 1px solid #ded8c9;
        margin: auto;
        max-width: 600px;
        padding: 30px;
      }
      h1 {
        margin-top: 0;
      }
      .receipt-row {
        border-bottom: 1px solid #ded8c9;
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
      }
      .total {
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
      }
      .button {
        background: #d66b3d;
        border: 0;
        color: white;
        cursor: pointer;
        display: inline-block;
        margin-top: 24px;
        padding: 14px 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your receipt</h1>
      <div id="receipt"></div>
      <a class="button" href="../index.html">Back to home</a>
      <a class="button" href="cart.html">View cart</a>
    </main>

    <script>
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const receipt = document.querySelector("#receipt");
      const subtotal = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );
      const discount = subtotal * 0.15;
      const total = subtotal - discount;

      if (!cart.length) {
        receipt.innerHTML = "<p>Your cart is empty.</p>";
      } else {
        receipt.innerHTML = `
          ${cart
            .map(
              (item) => `
                <div class="receipt-row">
                  <span>${item.name} × ${item.quantity}</span>
                  <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
                </div>
              `
            )
            .join("")}
          <div class="receipt-row">
            <span>Subtotal</span>
            <strong>$${subtotal.toFixed(2)}</strong>
          </div>
          <div class="receipt-row">
            <span>GOODVIBES discount</span>
            <strong>-$${discount.toFixed(2)}</strong>
          </div>
          <div class="receipt-row total">
            <span>Total</span>
            <strong>$${total.toFixed(2)}</strong>
          </div>
          <p>Payment is not required. This is a receipt preview only.</p>
        `;

      }
    </script>
    <script src="../theme.js"></script>
    <script src="../site-footer.js"></script>
  </body>
</html>
